# Local development database. Not used in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: junro
      POSTGRES_PASSWORD: junro
      POSTGRES_DB: junro
    ports:
      - '5434:5432' # 5434 on the host so it does not clash with other local databases
    volumes:
      - junro-pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U junro']
      interval: 2s
      timeout: 3s
      retries: 15

  # Optional: a web page to browse the database. Start it with:
  #   docker compose --profile tools up -d adminer      then open http://localhost:8081
  adminer:
    image: adminer:4
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - '8081:8080'

volumes:
  junro-pgdata:
